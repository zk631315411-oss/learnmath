name: learnmath

services:
  api:
    image: learnmath-api:${LEARNMATH_VERSION:-local}
    environment:
      AI_MATH_DB_PATH: /app/data/learning.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      QA_LLM_API_KEY: ${QA_LLM_API_KEY:-}
      QA_LLM_API_BASE: ${QA_LLM_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QA_LLM_MODEL: ${QA_LLM_MODEL:-qwen3.6-plus}
      FORMULA_API_KEY: ${FORMULA_API_KEY:-}
      FORMULA_API_BASE: ${FORMULA_API_BASE:-}
      FORMULA_MODEL: ${FORMULA_MODEL:-}
      FORMULA_CONVERSION_TIMEOUT_SECONDS: ${FORMULA_CONVERSION_TIMEOUT_SECONDS:-8}
      FORMULA_CONVERSION_TOTAL_TIMEOUT_SECONDS: ${FORMULA_CONVERSION_TOTAL_TIMEOUT_SECONDS:-15}
      FORMULA_VISION_API_KEY: ${FORMULA_VISION_API_KEY:-}
      FORMULA_VISION_API_BASE: ${FORMULA_VISION_API_BASE:-https://open.bigmodel.cn/api/paas/v4}
      FORMULA_VISION_MODEL: ${FORMULA_VISION_MODEL:-glm-4.1v-thinking-flash}
      FORMULA_VISION_THINKING: ${FORMULA_VISION_THINKING:-disabled}
      FORMULA_VISION_TIMEOUT_SECONDS: ${FORMULA_VISION_TIMEOUT_SECONDS:-25}
      FORMULA_FALLBACK_API_KEY: ${FORMULA_FALLBACK_API_KEY:-}
      FORMULA_FALLBACK_API_BASE: ${FORMULA_FALLBACK_API_BASE:-}
      FORMULA_FALLBACK_MODEL: ${FORMULA_FALLBACK_MODEL:-}
      FORMULA_FALLBACK_TIMEOUT_SECONDS: ${FORMULA_FALLBACK_TIMEOUT_SECONDS:-5}
      FORMULA_RECOGNIZE_TOTAL_TIMEOUT_SECONDS: ${FORMULA_RECOGNIZE_TOTAL_TIMEOUT_SECONDS:-30}
      FORMULA_CONTENT_VISION_TIMEOUT_SECONDS: ${FORMULA_CONTENT_VISION_TIMEOUT_SECONDS:-30}
      LEARNER_MODEL_ENABLED: ${LEARNER_MODEL_ENABLED:-true}
      LEARNER_MODEL_DEBUG: ${LEARNER_MODEL_DEBUG:-false}
      APP_ENV: ${APP_ENV:-production}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USER: ${NEO4J_USER:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: neo4j
      MANIM_REDIS_URL: redis://redis:6379/0
      MANIM_SPOOL_DIR: /app/manim-spool
      MANIM_RENDER_DIR: /app/manim-render
      MANIM_MAX_DURATION_SECONDS: ${MANIM_MAX_DURATION_SECONDS:-30}
      MANIM_RENDER_TIMEOUT_SECONDS: ${MANIM_RENDER_TIMEOUT_SECONDS:-90}
    volumes:
      - app-data:/app/data
      - manim-spool:/app/manim-spool
      - manim-render:/app/manim-render:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - manim-queue
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - manim-queue
    restart: unless-stopped

  manim-dispatcher:
    image: learnmath-api:${LEARNMATH_VERSION:-local}
    command: ["python", "-m", "scripts.run_manim_dispatcher"]
    # The dispatcher is a Redis worker, not an HTTP server. The API image's
    # inherited /ready healthcheck would always fail for this command.
    healthcheck:
      disable: true
    environment:
      MANIM_REDIS_URL: redis://redis:6379/0
      MANIM_QUEUE: learnmath-manim
      MANIM_SPOOL_DIR: /app/manim-spool
      MANIM_RENDER_DIR: /app/manim-render
    volumes:
      - manim-spool:/app/manim-spool
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - manim-queue
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  manim-renderer:
    image: learnmath-manim:${LEARNMATH_VERSION:-local}
    environment:
      MANIM_SPOOL_DIR: /var/lib/learnmath/spool
      MANIM_RENDER_DIR: /var/lib/learnmath/render
      MANIM_RENDER_TIMEOUT_SECONDS: ${MANIM_RENDER_TIMEOUT_SECONDS:-90}
      MANIM_MAX_DURATION_SECONDS: ${MANIM_MAX_DURATION_SECONDS:-30}
    volumes:
      - manim-spool:/var/lib/learnmath/spool
      - manim-render:/var/lib/learnmath/render
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
      - /home/manimuser:size=32m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped

  web:
    image: learnmath-web:${LEARNMATH_VERSION:-local}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LEARNMATH_PORT:-8080}:80"
    volumes:
      - ../data/textbooks:/opt/learnmath/textbooks:ro
    restart: unless-stopped

volumes:
  app-data:
  manim-spool:
  manim-render:

networks:
  default:
  manim-queue:
    internal: true
