<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>插入公式 · v3 单输入框</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  :root {
    --paper: #ece7da;
    --paper-2: #f5f1e8;
    --paper-3: #e3ddcf;
    --line: #d9d3c4;
    --ink: #2a2620;
    --ink-2: #4a4339;
    --ink-3: #9a9080;
    --brand: #a0522d;
    --brand-2: #8b4513;
    --ok: #059669;
    --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Source Serif 4', 'Songti SC', 'STSong', 'Noto Serif CJK SC', Georgia, serif;
    background: var(--paper);
    background-image: radial-gradient(rgb(74 67 57 / .045) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  button { font-family: inherit; }
  button:focus { outline: none; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ============ 弹窗 ============ */
  .modal {
    width: 540px; max-width: calc(100vw - 28px);
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: 0 24px 64px rgb(42 38 32 / .22), 0 2px 6px rgb(42 38 32 / .08);
    overflow: hidden;
    animation: in .3s var(--ease);
  }
  @keyframes in { from { opacity: 0; transform: translateY(8px) scale(.99); } }

  .head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 16px 20px 10px;
  }
  .title {
    font-size: 16px; font-weight: 600; color: var(--ink);
    display: flex; align-items: baseline; gap: 9px;
  }
  .title .glyph { color: var(--brand); font-style: italic; font-size: 19px; }
  .close {
    border: none; background: none; cursor: pointer; color: var(--ink-3);
    width: 28px; height: 28px; border-radius: var(--r-md); font-size: 13px;
    transition: background .15s, color .15s;
  }
  .close:hover { background: var(--paper-3); color: var(--ink); }

  .body { padding: 6px 20px 16px; }

  /* ============ 核心：一个输入框 ============ */
  .composer {
    background: #fffdf7;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    transition: border-color .15s, box-shadow .15s;
    /* 稿纸横线 */
    background-image: repeating-linear-gradient(to bottom, transparent 0 27px, rgb(160 82 45 / .06) 27px 28px);
    background-position: 0 12px;
  }
  .composer:focus-within {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgb(160 82 45 / .13);
  }
  .composer textarea {
    display: block; width: 100%;
    border: none; outline: none; resize: none; background: transparent;
    font: inherit; font-size: 15px; color: var(--ink);
    padding: 13px 14px 10px;
    min-height: 56px; line-height: 28px; /* 对齐稿纸横线 */
  }
  .composer textarea::placeholder { color: var(--ink-3); font-style: italic; }

  /* 预览：贴在输入框底部，是它的一部分，不是独立区域 */
  .preview {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 14px;
    border-top: 1px dashed var(--line);
    font-size: 14px; min-height: 40px;
  }
  .preview .tag {
    font-size: 10.5px; letter-spacing: .12em; color: var(--ink-3);
    text-transform: uppercase; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .preview .tag::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }
  .preview .tag.wait::before { background: var(--ink-3); }
  .preview .out { color: var(--ink); }
  .preview .hint { color: var(--ink-3); font-style: italic; font-size: 12.5px; }

  /* 输入框下方：符号带 + 角落工具（手写/更多） */
  .assist {
    display: flex; align-items: center; gap: 2px;
    margin-top: 10px; flex-wrap: wrap;
  }
  .glyph {
    min-width: 34px; height: 32px; padding: 0 7px;
    border: none; border-radius: var(--r-sm); background: none; cursor: pointer;
    color: var(--ink-2); font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s;
  }
  .glyph:hover { background: var(--paper-3); color: var(--brand); }
  .glyph .katex { font-size: .9em; }
  .assist .sep { width: 1px; height: 16px; background: var(--line); margin: 0 5px; }
  .assist .corner { margin-left: auto; display: flex; gap: 2px; }
  .corner .glyph { color: var(--ink-3); font-size: 13px; }
  .corner .glyph:hover { color: var(--brand); }

  /* 转写状态提示 */
  .translating {
    margin-top: 8px; font-size: 12px; font-style: italic; color: var(--brand);
    display: none; align-items: center; gap: 6px;
  }
  .translating.on { display: flex; }

  /* 常用公式：popover 下拉，默认收起 */
  .common-pop {
    position: fixed; z-index: 500;
    background: var(--paper-2);
    border: 1px solid var(--line); border-radius: var(--r-md);
    box-shadow: 0 10px 32px rgb(42 38 32 / .2);
    padding: 12px; width: 380px;
  }
  .common-pop .cp-label {
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 8px;
  }
  .common-pop .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .common-pop .tpl {
    border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--paper);
    cursor: pointer; padding: 8px 4px 6px; text-align: center;
    transition: border-color .12s, background .12s;
  }
  .common-pop .tpl:hover { border-color: var(--brand); background: rgb(160 82 45 / .05); }
  .common-pop .tpl .f { font-size: 12px; color: var(--ink); }
  .common-pop .tpl .n { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 3px; }

  /* ============ 底部 ============ */
  .foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 20px;
    border-top: 1px solid var(--line);
    background: var(--paper);
  }
  .foot-l { display: flex; align-items: center; gap: 10px; }
  .mode {
    display: inline-flex; gap: 2px; padding: 2px;
    background: var(--paper-3); border-radius: var(--r-md);
  }
  .mode button {
    border: none; background: none; cursor: pointer;
    font-size: 11.5px; padding: 4px 10px; border-radius: 6px;
    color: var(--ink-3); transition: all .14s;
  }
  .mode button.on { background: var(--paper-2); color: var(--ink); font-weight: 600; }
  .foot-r { display: flex; align-items: center; gap: 12px; }
  .fav {
    border: none; background: none; cursor: pointer; font-size: 12px;
    color: var(--ink-3); transition: color .14s; font-style: italic;
  }
  .fav:hover { color: var(--brand); }
  .btn-insert {
    border: none; cursor: pointer;
    background: var(--brand); color: #faf5ec;
    font-size: 13px; font-weight: 600; letter-spacing: .03em;
    padding: 8px 20px; border-radius: var(--r-md);
    transition: background .15s, transform .15s;
  }
  .btn-insert:hover { background: var(--brand-2); transform: translateY(-1px); }
  .btn-insert:active { transform: translateY(0); }
  .btn-insert:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  /* 说明浮标 */
  .note {
    position: fixed; left: 18px; bottom: 18px; max-width: 320px;
    font-size: 11.5px; line-height: 1.7; color: var(--ink-3);
    background: var(--paper-2); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 10px 12px; font-style: italic;
  }
  .note b { color: var(--brand); font-style: normal; }
</style>
</head>
<body>

<div class="modal">
  <div class="head">
    <div class="title"><span class="glyph">∑</span>插入公式</div>
    <button class="close" aria-label="关闭">✕</button>
  </div>

  <div class="body">
    <!-- 唯一的输入框：LaTeX 和中文通吃，打开即有光标 -->
    <div class="composer">
      <textarea id="input" rows="2" autofocus
        placeholder="直接输入 — \int_0^1 x^2 dx，或者说：x 从 0 到 1 的平方积分"></textarea>
      <div class="preview">
        <span class="tag wait" id="ptag">预览</span>
        <span class="hint" id="phint">输入即渲染；识别到描述会自动转写</span>
        <span class="out" id="pout" style="display:none"></span>
      </div>
    </div>
    <div class="translating" id="translating">✦ 正在把描述转写为公式…</div>

    <!-- 符号带：往光标处插；手写与常用收在右角 -->
    <div class="assist">
      <button class="glyph" data-ins="\frac{a}{b}" title="分数"></button>
      <button class="glyph" data-ins="\sqrt{x}" title="根式"></button>
      <button class="glyph" data-ins="^{2}" title="上标"></button>
      <button class="glyph" data-ins="_{i}" title="下标"></button>
      <span class="sep"></span>
      <button class="glyph" data-ins="\lim_{x\to 0}" title="极限"></button>
      <button class="glyph" data-ins="\int_{a}^{b}" title="积分"></button>
      <button class="glyph" data-ins="\sum_{i=1}^{n}" title="求和"></button>
      <button class="glyph" data-ins="\partial" title="偏微分"></button>
      <button class="glyph" data-ins="\infty" title="无穷"></button>
      <button class="glyph" data-ins="\pi" title="π"></button>
      <div class="corner">
        <button class="glyph" title="手写输入">✎</button>
        <button class="glyph" id="commonBtn" title="常用公式" popovertarget="commonPop" popovertargetaction="toggle">☰ 常用</button>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="foot-l">
      <div class="mode" role="radiogroup" aria-label="显示方式">
        <button class="on">自动</button><button>行内</button><button>独立</button>
      </div>
    </div>
    <div class="foot-r">
      <button class="fav">☆ 存为常用</button>
      <button class="btn-insert" id="insertBtn" disabled>插入公式 →</button>
    </div>
  </div>
</div>

<!-- 常用公式：默认收起，点开是 popover -->
<div class="common-pop" id="commonPop" popover>
  <div class="cp-label">常用结构</div>
  <div class="grid">
    <button class="tpl"><span class="f" data-ins="\lim_{x\to 0}\frac{f(x)}{g(x)}"></span><span class="n">极限</span></button>
    <button class="tpl"><span class="f" data-ins="\int_a^b f(x)\,dx"></span><span class="n">积分</span></button>
    <button class="tpl"><span class="f" data-ins="\sum_{i=1}^n a_i"></span><span class="n">求和</span></button>
    <button class="tpl"><span class="f" data-ins="\frac{d}{dx}f(x)"></span><span class="n">导数</span></button>
    <button class="tpl"><span class="f" data-ins="\begin{pmatrix} a & b \\ c & d \end{pmatrix}"></span><span class="n">矩阵</span></button>
    <button class="tpl"><span class="f" data-ins="\vec{a}\cdot\vec{b}"></span><span class="n">点积</span></button>
  </div>
</div>

<div class="note">
  <b>v3 的思路：</b>没有页签。一个输入框通吃 LaTeX 与中文描述，打开光标就在里面；符号带是辅助不是路径；手写和常用模板收进角落。从"三个工具"变回"一个框，三种填法"。
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>
  const input = document.getElementById('input');
  const ptag = document.getElementById('ptag');
  const phint = document.getElementById('phint');
  const pout = document.getElementById('pout');
  const insertBtn = document.getElementById('insertBtn');
  const translating = document.getElementById('translating');

  // 判断像不像 LaTeX（含 \ 或 _ ^ { } 等）
  function looksLikeLatex(s) { return /\\|[_^{}]/.test(s); }

  // 一个简单的"描述 → LaTeX"演示映射（真实版走后端转写）
  const demoTranslate = [
    [/积分/, '\\int_0^1 x^2\\,dx'],
    [/极限/, '\\lim_{x \\to 0} \\frac{\\sin x}{x}'],
    [/求和/, '\\sum_{i=1}^{n} i^2'],
  ];

  let debounce;
  function render(tex) {
    try {
      katex.render(tex, pout, { throwOnError: true, displayMode: false });
      phint.style.display = 'none'; pout.style.display = '';
      ptag.classList.remove('wait');
      insertBtn.disabled = false;
      return true;
    } catch (e) { return false; }
  }

  input.addEventListener('input', () => {
    const v = input.value.trim();
    clearTimeout(debounce);
    translating.classList.remove('on');
    if (!v) {
      pout.style.display = 'none'; phint.style.display = '';
      ptag.classList.add('wait'); insertBtn.disabled = true;
      return;
    }
    if (looksLikeLatex(v)) {
      if (!render(v)) { /* 输入到一半，等下一个字符 */ }
    } else {
      // 像自然语言 → 演示转写
      translating.classList.add('on');
      debounce = setTimeout(() => {
        translating.classList.remove('on');
        const hit = demoTranslate.find(([re]) => re.test(v));
        if (hit) render(hit[1]);
        else { pout.style.display='none'; phint.style.display=''; phint.textContent='（真实版本此处调用转写接口）'; }
      }, 650);
    }
  });

  // 符号 / 模板：插入到光标处
  function insertAtCursor(tex) {
    const s = input.selectionStart, e = input.selectionEnd;
    input.value = input.value.slice(0, s) + tex + input.value.slice(e);
    input.focus();
    input.selectionStart = input.selectionEnd = s + tex.length;
    input.dispatchEvent(new Event('input'));
  }
  document.querySelectorAll('[data-ins]').forEach(el => {
    // 渲染符号外观
    try { katex.render(el.dataset.ins, el, { throwOnError: false }); } catch(e){}
    const host = el.closest('button');
    host.addEventListener('click', () => {
      insertAtCursor(el.dataset.ins);
      const pop = document.getElementById('commonPop');
      if (pop.matches(':popover-open')) pop.hidePopover();
    });
  });

  // 显示方式
  document.querySelectorAll('.mode button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.mode button').forEach(x => x.classList.toggle('on', x === b));
  }));

  input.focus();
</script>
</body>
</html>
