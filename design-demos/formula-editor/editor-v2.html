<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>插入公式 · v2 渐进披露</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  /* === 主站暖纸令牌 + 深色面板 === */
  :root {
    --paper: #ece7da;
    --paper-2: #f5f1e8;
    --paper-3: #e3ddcf;
    --line: #d9d3c4;
    --ink: #2a2620;
    --ink-2: #4a4339;
    --ink-3: #9a9080;
    --brand: #a0522d;
    --brand-2: #8b4513;
    --ok: #059669;

    /* 深色编辑面板（羊皮纸上的墨砚） */
    --panel: #221e18;
    --panel-2: #2b2620;
    --panel-line: #3d372d;
    --panel-ink: #ede6d8;
    --panel-ink-3: #8f8574;

    --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
    --ease: cubic-bezier(.22,1,.36,1); /* ease-out-quart 风格 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Source Serif 4', 'Songti SC', 'STSong', 'Noto Serif CJK SC', Georgia, serif;
    background: var(--paper);
    background-image: radial-gradient(rgb(74 67 57 / .045) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  button { font-family: inherit; }
  button:focus { outline: none; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ============ 弹窗 ============ */
  .modal {
    width: 560px; max-width: calc(100vw - 28px);
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: 0 24px 64px rgb(42 38 32 / .22), 0 2px 6px rgb(42 38 32 / .08);
    overflow: hidden;
    animation: in .35s var(--ease);
  }
  @keyframes in { from { opacity: 0; transform: translateY(10px) scale(.985); } }

  .head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 18px 22px 12px;
  }
  .title {
    font-size: 17px; font-weight: 600; color: var(--ink); letter-spacing: .01em;
    display: flex; align-items: baseline; gap: 10px;
  }
  .title .glyph { color: var(--brand); font-style: italic; font-size: 20px; }
  .close {
    border: none; background: none; cursor: pointer; color: var(--ink-3);
    width: 30px; height: 30px; border-radius: var(--r-md); font-size: 14px;
    transition: background .15s, color .15s;
  }
  .close:hover { background: var(--paper-3); color: var(--ink); }

  /* ============ 路径选择（关键：主导航，不是装饰 tab） ============ */
  .paths {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 0; padding: 0 22px;
  }
  .path {
    border: none; background: none; cursor: pointer;
    padding: 10px 6px 12px; text-align: left; position: relative;
    color: var(--ink-3); transition: color .18s;
  }
  .path .p-name { display: block; font-size: 13.5px; font-weight: 600; }
  .path .p-hint { display: block; font-size: 11px; margin-top: 2px; font-style: italic; opacity: .85; }
  .path::after {
    content: ''; position: absolute; left: 6px; right: 6px; bottom: 0;
    height: 2px; background: transparent; border-radius: 2px; transition: background .2s;
  }
  .path:hover { color: var(--ink-2); }
  .path.on { color: var(--brand); }
  .path.on::after { background: var(--brand); }
  .paths-rule { height: 1px; background: var(--line); margin: 0 22px; }

  .body { padding: 16px 22px 18px; }
  .pane { display: none; animation: fade .25s var(--ease); }
  .pane.on { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }

  /* ============ 画布（深色面板） — 三条路径共用 ============ */
  .stage {
    background: var(--panel);
    border-radius: var(--r-md);
    border: 1px solid var(--panel-line);
    padding: 18px 18px 14px;
    position: relative;
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .03);
  }
  .stage-label {
    position: absolute; top: -8px; left: 14px;
    background: var(--paper-2); padding: 0 7px;
    font-size: 10.5px; letter-spacing: .14em; color: var(--ink-3);
    text-transform: uppercase;
  }
  .stage-empty {
    color: var(--panel-ink-3); font-size: 13.5px; font-style: italic;
    padding: 10px 2px; line-height: 1.7;
  }
  .stage-empty kbd {
    font-family: inherit; font-style: normal; font-size: 11.5px;
    border: 1px solid var(--panel-line); border-radius: var(--r-sm);
    padding: 1px 6px; color: var(--panel-ink); background: var(--panel-2);
  }
  .stage-render { color: var(--panel-ink); font-size: 21px; padding: 8px 2px 4px; min-height: 46px; }
  .stage-render .katex { color: var(--panel-ink); }

  /* ============ 转写路径 ============ */
  .nl-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .nl-box {
    flex: 1; display: flex; align-items: center;
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md);
    transition: border-color .15s, box-shadow .15s;
  }
  .nl-box:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgb(160 82 45 / .14); }
  .nl-box input {
    flex: 1; border: none; outline: none; background: none;
    font: inherit; font-size: 13.5px; color: var(--ink);
    padding: 9px 12px;
  }
  .nl-box input::placeholder { color: var(--ink-3); font-style: italic; }
  .btn-ghost {
    border: 1px solid var(--brand); color: var(--brand); background: none;
    border-radius: var(--r-md); padding: 0 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .btn-ghost:hover { background: rgb(160 82 45 / .08); }
  .examples { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .examples .eg {
    border: none; background: none; cursor: pointer; padding: 0;
    font: inherit; font-size: 12px; font-style: italic; color: var(--ink-3);
    border-bottom: 1px dashed var(--line); transition: color .15s, border-color .15s;
  }
  .examples .eg:hover { color: var(--brand); border-color: var(--brand); }
  .examples .lead { font-size: 12px; color: var(--ink-3); font-style: italic; }

  /* ============ 搭建路径：符号架 + 模板 ============ */
  .rack-label {
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-3); margin: 16px 0 8px; display: flex; align-items: center; gap: 10px;
  }
  .rack-label:first-child { margin-top: 0; }
  .rack-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .glyphs { display: flex; flex-wrap: wrap; gap: 4px; }
  .glyph {
    min-width: 38px; height: 36px; padding: 0 8px;
    border: none; border-radius: var(--r-sm); background: none; cursor: pointer;
    color: var(--ink-2); font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s, transform .12s;
  }
  .glyph:hover { background: var(--paper-3); color: var(--brand); transform: translateY(-1px); }
  .glyph:active { transform: translateY(0); }
  .glyph .katex { font-size: .95em; }
  .glyphs .sep { width: 1px; background: var(--line); margin: 7px 5px; }

  .tpls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tpl {
    border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper);
    cursor: pointer; padding: 10px 6px 8px; text-align: center;
    transition: border-color .13s, transform .13s, box-shadow .13s;
  }
  .tpl:hover {
    border-color: var(--brand); transform: translateY(-2px);
    box-shadow: 0 4px 12px rgb(42 38 32 / .1);
  }
  .tpl .f { color: var(--ink); font-size: 13px; }
  .tpl .n { display: block; font-size: 11px; color: var(--ink-3); margin-top: 4px; font-style: italic; }
  .tpl:hover .n { color: var(--brand); }

  /* ============ 手写路径 ============ */
  .ink-hint {
    font-size: 12.5px; font-style: italic; color: var(--ink-3);
    margin-bottom: 10px; line-height: 1.6;
  }
  .ink-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-mini {
    border: 1px solid var(--line); background: none; color: var(--ink-2);
    border-radius: var(--r-md); padding: 5px 12px; font-size: 12px; cursor: pointer;
    transition: all .13s;
  }
  .btn-mini:hover { border-color: var(--brand); color: var(--brand); }
  .ink-squiggle { color: var(--panel-ink-3); }

  /* ============ 底部 ============ */
  .foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 22px;
    border-top: 1px solid var(--line);
    background: var(--paper);
  }
  .mode {
    display: inline-flex; gap: 2px; padding: 2px;
    background: var(--paper-3); border-radius: var(--r-md);
  }
  .mode button {
    border: none; background: none; cursor: pointer;
    font-size: 12px; padding: 5px 12px; border-radius: 6px;
    color: var(--ink-3); transition: all .14s;
  }
  .mode button.on { background: var(--paper-2); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(42 38 32 / .12); }
  .foot-r { display: flex; align-items: center; gap: 12px; }
  .fav {
    border: none; background: none; cursor: pointer; font-size: 12px;
    color: var(--ink-3); transition: color .14s; font-style: italic;
  }
  .fav:hover { color: var(--brand); }
  .btn-insert {
    border: none; cursor: pointer;
    background: var(--brand); color: #faf5ec;
    font-size: 13.5px; font-weight: 600; letter-spacing: .03em;
    padding: 9px 22px; border-radius: var(--r-md);
    transition: background .15s, transform .15s;
  }
  .btn-insert:hover { background: var(--brand-2); transform: translateY(-1px); }
  .btn-insert:active { transform: translateY(0); }

  /* 设计说明浮标 */
  .note {
    position: fixed; left: 18px; bottom: 18px; max-width: 300px;
    font-size: 11.5px; line-height: 1.7; color: var(--ink-3);
    background: var(--paper-2); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 10px 12px; font-style: italic;
  }
  .note b { color: var(--brand); font-style: normal; }
</style>
</head>
<body>

<div class="modal">
  <div class="head">
    <div class="title"><span class="glyph">∑</span>插入公式</div>
    <button class="close" aria-label="关闭">✕</button>
  </div>

  <!-- 路径选择：三条创作路径，一次只走一条 -->
  <div class="paths" role="tablist">
    <button class="path on" role="tab" data-pane="p-write" aria-selected="true">
      <span class="p-name">描述</span><span class="p-hint">说一句话</span>
    </button>
    <button class="path" role="tab" data-pane="p-build" aria-selected="false">
      <span class="p-name">搭建</span><span class="p-hint">符号与模板</span>
    </button>
    <button class="path" role="tab" data-pane="p-draw" aria-selected="false">
      <span class="p-name">手写</span><span class="p-hint">画出来</span>
    </button>
  </div>
  <div class="paths-rule"></div>

  <div class="body">

    <!-- 路径 1：描述转写 -->
    <section class="pane on" id="p-write">
      <div class="nl-row">
        <div class="nl-box">
          <input placeholder="x 趋于 0 时，sin x 除以 x 的极限" aria-label="用自然语言描述公式">
        </div>
        <button class="btn-ghost">转换</button>
      </div>
      <div class="examples">
        <span class="lead">试试 —</span>
        <button class="eg">(sin x)² 除以 x，x 趋于 0</button>
        <button class="eg">f 从 a 到 b 的定积分</button>
        <button class="eg">二阶导数等于零</button>
      </div>
      <div class="stage" style="margin-top:16px">
        <span class="stage-label">预览 Preview</span>
        <div class="stage-render" id="r1"></div>
      </div>
    </section>

    <!-- 路径 2：搭建（符号架 + 模板） -->
    <section class="pane" id="p-build">
      <div class="stage">
        <span class="stage-label">编辑 Edit</span>
        <div class="stage-empty">
          点下方符号放入公式，或直接键入 <kbd>\frac</kbd> 这样的 LaTeX 命令。
        </div>
        <div class="stage-render" id="r2"></div>
      </div>

      <div class="rack-label">符号</div>
      <div class="glyphs">
        <button class="glyph" data-tex="\frac{a}{b}" title="分数"></button>
        <button class="glyph" data-tex="\sqrt{x}" title="根式"></button>
        <button class="glyph" data-tex="x^{2}" title="上标"></button>
        <button class="glyph" data-tex="x_{i}" title="下标"></button>
        <span class="sep"></span>
        <button class="glyph" data-tex="\lim_{x\to 0}" title="极限"></button>
        <button class="glyph" data-tex="\int_{a}^{b}" title="积分"></button>
        <button class="glyph" data-tex="\sum_{i=1}^{n}" title="求和"></button>
        <button class="glyph" data-tex="\prod_{i=1}^{n}" title="连乘"></button>
        <span class="sep"></span>
        <button class="glyph" data-tex="\partial" title="偏微分"></button>
        <button class="glyph" data-tex="\infty" title="无穷"></button>
        <button class="glyph" data-tex="\pi" title="π"></button>
        <button class="glyph" data-tex="\pm" title="正负"></button>
        <button class="glyph" title="矩阵">▦</button>
        <button class="glyph" title="更多符号" style="color:var(--ink-3)">▾</button>
      </div>

      <div class="rack-label">常用结构</div>
      <div class="tpls">
        <button class="tpl"><span class="f" data-tex="\lim_{x\to 0}\frac{f(x)}{g(x)}"></span><span class="n">极限</span></button>
        <button class="tpl"><span class="f" data-tex="\int_a^b f(x)\,dx"></span><span class="n">积分</span></button>
        <button class="tpl"><span class="f" data-tex="\sum_{i=1}^n a_i"></span><span class="n">求和</span></button>
        <button class="tpl"><span class="f" data-tex="\frac{d}{dx}f(x)"></span><span class="n">导数</span></button>
        <button class="tpl"><span class="f" data-tex="\begin{pmatrix} a & b \\ c & d \end{pmatrix}"></span><span class="n">矩阵</span></button>
        <button class="tpl"><span class="f" data-tex="\begin{vmatrix} a & b \\ c & d \end{vmatrix}"></span><span class="n">行列式</span></button>
        <button class="tpl"><span class="f" data-tex="\vec{a}\cdot\vec{b}"></span><span class="n">点积</span></button>
        <button class="tpl"><span class="f" data-tex="f(x)=\begin{cases} \square \\ \square \end{cases}"></span><span class="n">分段</span></button>
      </div>
    </section>

    <!-- 路径 3：手写 -->
    <section class="pane" id="p-draw">
      <div class="ink-hint">在下面的面板里用鼠标或手指写出公式，松手后自动识别。</div>
      <div class="stage" style="min-height:150px">
        <span class="stage-label">手写 Write</span>
        <svg class="ink-squiggle" width="100%" height="120" viewBox="0 0 500 120" fill="none">
          <path d="M60 90 C 80 20, 110 20, 120 60 S 150 100, 175 55" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 7"/>
          <path d="M230 40 h70 M265 15 v60" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 7"/>
          <path d="M360 85 c 10 -55, 55 -60, 60 -20 c 4 32 -40 40 -55 15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 7"/>
        </svg>
      </div>
      <div class="ink-actions">
        <button class="btn-mini">清除</button>
        <button class="btn-mini">撤销一笔</button>
        <span style="flex:1"></span>
        <button class="btn-ghost" style="padding:5px 14px">识别</button>
      </div>
    </section>
  </div>

  <div class="foot">
    <div class="mode" role="radiogroup" aria-label="公式显示方式">
      <button class="on">自动</button><button>行内</button><button>独立</button>
    </div>
    <div class="foot-r">
      <button class="fav">☆ 存为常用</button>
      <button class="btn-insert">插入公式 →</button>
    </div>
  </div>
</div>

<div class="note">
  <b>这版改了什么：</b>三条输入路径变成主导航（一次只看一条）；画布统一成深色面板——羊皮纸上的墨砚；转写区的预览、搭建区的编辑、手写区的画板都是同一个容器。
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>
  // 渲染所有 KaTeX 片段
  document.querySelectorAll('[data-tex]').forEach(el => {
    try { katex.render(el.dataset.tex, el, { throwOnError: false }); } catch(e){}
  });
  katex.render('\\lim_{x \\to 0} \\dfrac{\\sin x}{x} = 1', document.getElementById('r1'), { throwOnError: false, displayMode: true });

  // 路径切换
  const paths = document.querySelectorAll('.path');
  paths.forEach(p => p.addEventListener('click', () => {
    paths.forEach(q => { q.classList.toggle('on', q === p); q.setAttribute('aria-selected', q === p); });
    document.querySelectorAll('.pane').forEach(s => s.classList.toggle('on', s.id === p.dataset.pane));
  }));

  // 搭建路径：点符号/模板时在编辑面板里演示渲染
  const r2 = document.getElementById('r2');
  let built = [];
  document.querySelectorAll('#p-build .glyph[data-tex], #p-build .tpl .f').forEach(el => {
    const host = el.closest('button');
    host.addEventListener('click', () => {
      const tex = el.dataset.tex || el.querySelector('[data-tex]')?.dataset.tex;
      if (!tex) return;
      built.push(tex);
      document.querySelector('#p-build .stage-empty').style.display = 'none';
      try { katex.render(built.join(' \\; '), r2, { throwOnError: false, displayMode: true }); } catch(e){}
    });
  });

  // 显示方式分段
  document.querySelectorAll('.mode button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.mode button').forEach(x => x.classList.toggle('on', x === b));
  }));
</script>
</body>
</html>
