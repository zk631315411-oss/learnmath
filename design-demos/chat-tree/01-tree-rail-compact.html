<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提问树 · 紧凑树状 Rail · 学数有道</title>
  <style>
    :root {
      --bg: #f6f7fb; --surface: #fff; --surface-2: #f8fafc; --border: #e2e8f0;
      --text: #334155; --strong: #0f172a; --muted: #64748b; --brand: #4f46e5;
      --brand-soft: #eef2ff; --amber: #b45309; --amber-soft: #fffbeb; --line: #cbd5e1;
      --shadow: 0 8px 28px rgb(15 23 42 / .08);
    }
    [data-theme="dark"] {
      --bg: #0f172a; --surface: #1e293b; --surface-2: #172235; --border: #334155;
      --text: #cbd5e1; --strong: #f8fafc; --muted: #94a3b8; --brand: #818cf8;
      --brand-soft: #272457; --amber: #fbbf24; --amber-soft: #332b16; --line: #475569;
      --shadow: 0 10px 30px rgb(0 0 0 / .3);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, select { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--border); background: var(--surface); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--strong); font-weight: 700; }
    .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--strong); color: var(--surface); font-size: 13px; }
    .brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; }
    .top-actions { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 30px; padding: 0 9px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text); transition: .18s ease; }
    .button:hover { border-color: var(--border); background: var(--bg); color: var(--strong); }
    .button.icon { width: 30px; padding: 0; font-size: 16px; }
    .button.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
    .workspace { width: min(1160px, 100%); margin: 0 auto; padding: clamp(20px, 4vw, 42px) clamp(14px, 4vw, 32px) 56px; flex: 1; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .eyebrow { margin: 0 0 5px; color: var(--brand); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--strong); font-size: clamp(22px, 3vw, 30px); line-height: 1.25; }
    .intro p { max-width: 560px; margin: 8px 0 0; color: var(--muted); }
    .legend { display: flex; flex-wrap: wrap; gap: 11px; color: var(--muted); font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
    .legend i.active { background: var(--brand); } .legend i.path { background: #94a3b8; } .legend i.branch { background: #fbbf24; }
    .demo-shell { display: grid; grid-template-columns: minmax(0, 1fr) 236px; min-height: 660px; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .chat-main { min-width: 0; display: flex; flex-direction: column; }
    .chat-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .chat-title { min-width: 0; }
    .chat-title strong { display: block; overflow: hidden; color: var(--strong); font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .chat-title span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .status { display: inline-flex; align-items: center; gap: 6px; flex: none; color: var(--muted); font-size: 12px; }
    .status i { width: 7px; height: 7px; border-radius: 50%; background: #059669; }
    .messages { flex: 1; min-height: 0; padding: 22px clamp(16px, 4vw, 46px); overflow: auto; }
    .path { display: flex; align-items: center; gap: 7px; margin-bottom: 22px; color: var(--muted); font-size: 12px; }
    .path b { overflow: hidden; color: var(--text); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .message { max-width: 760px; margin-bottom: 18px; }
    .message.user { max-width: min(78%, 620px); margin-left: auto; }
    .message-label { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--muted); font-size: 11px; }
    .message.user .message-label { justify-content: flex-end; }
    .bubble { padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
    .message.user .bubble { border-color: var(--brand); border-bottom-right-radius: 4px; background: var(--brand); color: #fff; }
    .message.assistant .bubble { border-bottom-left-radius: 4px; }
    .bubble p { margin: 0; }
    .branch-cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 760px; margin: 8px 0 18px; padding: 12px 14px; border: 1px solid #fcd34d; border-radius: 8px; background: var(--amber-soft); color: var(--amber); font-size: 12px; }
    .branch-cta strong { color: var(--strong); font-size: 13px; }
    .rail { min-width: 0; display: flex; flex-direction: column; border-left: 1px solid var(--border); background: var(--surface-2); }
    .rail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 13px 12px 9px; border-bottom: 1px solid var(--border); }
    .rail-head strong { display: block; color: var(--strong); font-size: 13px; }
    .rail-head span { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }
    .rail-tools { display: flex; align-items: center; gap: 5px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .rail-tools select { min-width: 100px; height: 28px; padding: 0 5px; border: 1px solid var(--border); border-radius: 6px; outline: none; background: var(--surface); color: var(--text); font-size: 10px; }
    .rail-tools .button { min-height: 28px; padding: 0 6px; font-size: 10px; }
    .rail-tools .button.active { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
    .mini-note { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 10px; line-height: 1.4; }
    .mini-note b { color: var(--text); font-weight: 600; }
    .tree-viewport { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
    .tree-canvas { position: relative; min-width: 410px; min-height: 420px; }
    .tree-canvas svg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.3; }
    .edge.active { stroke: var(--brand); stroke-width: 2; }
    .node { position: absolute; display: flex; align-items: center; width: 84px; min-height: 31px; padding: 5px 5px 5px 6px; border: 1px solid var(--border); border-radius: 6px; outline: none; background: var(--surface); color: var(--text); cursor: pointer; box-shadow: 0 1px 4px rgb(15 23 42 / .05); transition: .16s ease; }
    .node:hover { border-color: var(--brand); transform: translateY(-1px); }
    .node:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
    .node.active { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 16%, transparent); }
    .node.path { border-color: #94a3b8; }
    .node.branch { border-top: 2px solid #fbbf24; }
    .node.active.branch { border-color: #f59e0b; background: var(--amber-soft); }
    .node-dot { flex: none; width: 7px; height: 7px; margin-right: 5px; border: 2px solid var(--line); border-radius: 50%; background: var(--surface); }
    .node.active .node-dot { border-color: var(--brand); background: var(--brand); }
    .node.path .node-dot { border-color: #94a3b8; background: #94a3b8; }
    .node.branch .node-dot { border-color: #fbbf24; }
    .node.active.branch .node-dot { border-color: #f59e0b; background: #fbbf24; }
    .node-copy { min-width: 0; }
    .node-copy strong { display: block; overflow: hidden; color: var(--strong); font-size: 10px; font-weight: 650; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
    .node-copy small { display: block; margin-top: 1px; overflow: hidden; color: var(--muted); font-size: 8px; line-height: 1.15; text-overflow: ellipsis; white-space: nowrap; }
    .node-toggle { position: absolute; right: 3px; bottom: 2px; display: grid; place-items: center; width: 12px; height: 12px; padding: 0; border: 1px solid var(--border); border-radius: 3px; background: var(--surface); color: var(--muted); font-size: 9px; line-height: 1; }
    .node-toggle:hover { border-color: var(--brand); color: var(--brand); }
    .selection { min-height: 57px; padding: 8px 10px; border-top: 1px solid var(--border); background: var(--surface); }
    .selection-label { color: var(--muted); font-size: 9px; }
    .selection strong { display: block; overflow: hidden; margin-top: 1px; color: var(--strong); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .selection small { display: block; overflow: hidden; color: var(--muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .rail-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 10px; border-top: 1px solid var(--border); color: var(--muted); font-size: 9px; }
    .rail-footer button { padding: 0; border: 0; background: transparent; color: var(--brand); font-size: 9px; }
    .rail-footer button:hover { text-decoration: underline; }
    .variant-note { margin-top: 18px; color: var(--muted); font-size: 12px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 5; max-width: min(360px, calc(100vw - 32px)); padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); color: var(--text); font-size: 12px; opacity: 0; pointer-events: none; transform: translateY(8px); transition: .2s ease; }
    .toast.show { opacity: 1; transform: none; }
    @media (max-width: 760px) {
      .topbar { height: 54px; padding: 0 14px; } .brand small, .top-actions > span { display: none; }
      .workspace { padding: 20px 10px 30px; } .intro { display: block; } .intro .legend { margin-top: 14px; }
      .demo-shell { display: flex; flex-direction: column; min-height: calc(100vh - 185px); }
      .rail { order: 2; height: 320px; border-top: 1px solid var(--border); border-left: 0; }
      .rail-head { padding: 8px 10px 6px; }
      .rail-tools { padding: 5px 8px; }
      .mini-note { display: none; }
      .tree-canvas { min-height: 330px; }
      .selection { min-height: 38px; height: 38px; padding: 4px 8px; }
      .selection small { display: none; }
      .rail-footer { padding: 5px 8px; }
      .messages { padding: 18px 13px 20px; } .message.user { max-width: 90%; }
      .branch-cta { align-items: flex-start; flex-direction: column; gap: 8px; } .toast { right: 16px; bottom: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">学</span><div>学数有道<small>提问树 · 方案 1C</small></div></div>
      <div class="top-actions"><span>高等代数（上册）</span><button class="button icon" id="themeBtn" aria-label="切换暗色模式" title="切换暗色模式">☾</button></div>
    </header>
    <main class="workspace">
      <div class="intro">
        <div><p class="eyebrow">Conversation tree / compact rail</p><h1>紧凑树状 Rail</h1><p>真实父子树，但只占约 236px：短标签、独立滚动、折叠旁支，完整标题放在选中节点详情里。</p></div>
        <div class="legend"><span><i class="active"></i>当前节点</span><span><i class="path"></i>当前路径</span><span><i class="branch"></i>可继续分支</span></div>
      </div>
      <section class="demo-shell">
        <div class="chat-main">
          <div class="chat-head"><div class="chat-title"><strong id="threadTitle"></strong><span id="threadMeta"></span></div><div class="status"><i></i>已保存</div></div>
          <div class="messages" id="messages"></div>
        </div>
        <aside class="rail">
          <div class="rail-head"><div><strong>对话树</strong><span id="summary"></span></div><button class="button icon" id="locate" aria-label="定位当前节点" title="定位当前节点">⌖</button></div>
          <div class="rail-tools"><select id="scenario" aria-label="选择分支数量"><option value="normal">常规 · 10 节点</option><option value="dense" selected>分支多 · 15 节点</option></select><button class="button" id="focus">聚焦</button><button class="button" id="expand">展开</button></div>
          <div class="mini-note"><b>空间策略：</b>同层横排，树区自己滚动；节点过多时折叠非当前旁支。</div>
          <div class="tree-viewport" id="viewport"><div class="tree-canvas" id="canvas"></div></div>
          <div class="selection"><span class="selection-label">当前节点</span><strong id="selectionTitle"></strong><small id="selectionPath"></small></div>
          <div class="rail-footer"><span id="footerText"></span><button id="newBranch">从此处继续</button></div>
        </aside>
      </section>
      <p class="variant-note">这个版本把树缩成“导航地图”：节点负责定位，完整问题和回答仍在左侧聊天区；点击节点右下角的小方块可折叠其子树。</p>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    var nodes = [
      {id:'root', parent:null, title:'线性无关？', full:'什么是线性无关？', meta:'根问题', q:'什么是线性无关？', a:'线性无关描述的是一组向量之间没有“多余成员”：任何一个向量都不能由其余向量线性表示。', d:'先把它理解成“每个方向都带来新的信息”。'},
      {id:'definition', parent:'root', title:'回到定义', full:'回到定义', meta:'分支 1', q:'能先从定义讲清楚吗？', a:'如果只有平凡组合能得到零向量，就称这组向量线性无关。', d:'这条路径适合先建立概念。'},
      {id:'proof', parent:'root', title:'从定义证明', full:'从定义证明判定方法', meta:'分支 2', q:'能从定义证明判定方法吗？', a:'把向量按列组成矩阵 A，齐次方程 Ax = 0 的解恰好对应线性组合的系数。', d:'当且仅当 Ax = 0 只有零解时，列向量线性无关。'},
      {id:'example', parent:'root', title:'看一个例子', full:'看一个直观例子', meta:'分支 3', q:'给一个直观例子吧。', a:'向量 (1, 0) 与 (0, 1) 提供两个独立方向，因此它们线性无关。', d:'例子能帮助检查定义是否被理解。'},
      {id:'def-intuition', parent:'definition', title:'直观比喻', full:'用“信息量”比喻', meta:'定义 · 子分支', q:'可以用“信息量”来比喻吗？', a:'每加入一个线性无关向量，就增加一个不能由已有向量替代的新方向。', d:'这只帮助建立直觉，不能替代正式定义。'},
      {id:'def-formal', parent:'definition', title:'写成公式', full:'把定义写成公式', meta:'定义 · 子分支', q:'把定义写成公式是什么？', a:'c₁v₁ + c₂v₂ + … + cₙvₙ = 0，推出所有系数都为零。', d:'所有系数都为零，称为只有平凡解。'},
      {id:'proof-rank', parent:'proof', title:'列秩判定', full:'和列秩有什么关系？', meta:'证明 · 子分支', q:'和列秩有什么关系？', a:'列向量线性无关，当且仅当矩阵的列秩等于列数。', d:'这是实际计算中常用的等价判定。'},
      {id:'proof-gauss', parent:'proof', title:'高斯消元', full:'用高斯消元检验', meta:'证明 · 子分支', q:'能用高斯消元检验吗？', a:'若每一列都有主元，就说明列向量线性无关。', d:'消元把抽象定义变成可执行步骤。'},
      {id:'example-counter', parent:'example', title:'反例易错', full:'反例与易错点', meta:'例子 · 子分支', q:'给一个相关的反例。', a:'(1, 2) 与 (2, 4) 不是线性无关，后者是前者的 2 倍。', d:'向量不相同，不代表线性无关。'},
      {id:'example-geometry', parent:'example', title:'几何解释', full:'换一种几何解释', meta:'例子 · 子分支', q:'可以用几何方式解释吗？', a:'不共线的两个向量提供两个独立方向，因此线性无关。', d:'若落在同一条直线上，一个方向可以由另一个缩放得到。'},
      {id:'def-intuition-analogy', parent:'def-intuition', title:'书架类比', full:'用书架做类比', meta:'直观 · 深入', q:'再给一个生活类比。', a:'像书架上的独立支点：删掉任何一个，能覆盖的方向就少一个。', d:'回到计算时仍要检查齐次方程。'},
      {id:'proof-rank-practice', parent:'proof-rank', title:'练习题', full:'练一道列秩判定题', meta:'列秩 · 深入', q:'能给一道小练习吗？', a:'判断 (1,0,1)、(0,1,1)、(1,1,2) 是否线性无关。', d:'第三个向量等于前两个之和，所以线性相关。'},
      {id:'proof-rank-error', parent:'proof-rank', title:'主元误判', full:'主元误判', meta:'列秩 · 易错', q:'没有主元时容易错在哪里？', a:'自由变量意味着存在非平凡解，不能把“行数足够”误认为“列向量独立”。', d:'要数的是每一列是否获得主元。'},
      {id:'example-geometry-visual', parent:'example-geometry', title:'画成方向', full:'把向量画成方向', meta:'几何 · 深入', q:'怎么把它画出来？', a:'不共线的箭头张成一个平面区域，只有一个方向时只能落在一条直线上。', d:'图像提示维度，结论仍由线性组合决定。'},
      {id:'example-geometry-3d', parent:'example-geometry', title:'推广三维', full:'推广到三维空间', meta:'几何 · 延伸', q:'三维里怎么推广？', a:'三个向量若不落在同一个平面内，就提供三个独立方向。', d:'这与三阶矩阵的非零行列式判定对应。'}
    ];
    var byId = {}; nodes.forEach(function(n) { byId[n.id] = n; });
    var sets = {normal: ['root','definition','proof','example','def-intuition','def-formal','proof-rank','proof-gauss','example-counter','example-geometry'], dense: nodes.map(function(n) { return n.id; })};
    var mode = 'dense', active = 'proof-rank-error', collapsed = new Set(), focus = false;
    var W = 84, H = 31, levelGap = 65, leafGap = 100;
    var $ = function(id) { return document.getElementById(id); };
    function esc(s) { return String(s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function toast(text) { var el = $('toast'); el.textContent = text; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function() { el.classList.remove('show'); }, 2100); }
    function pathTo(id) { var out = [], n = byId[id]; while (n) { out.unshift(n.id); n = n.parent ? byId[n.parent] : null; } return out; }
    function children(id, list) { return list.filter(function(n) { return n.parent === id; }); }
    function allowed() {
      var set = new Set(sets[mode]);
      if (!focus) return set;
      var path = new Set(pathTo(active)); path.add(active);
      nodes.forEach(function(n) { if (n.parent === active) path.add(n.id); });
      return new Set(Array.from(set).filter(function(id) { return path.has(id); }));
    }
    function visibleList() {
      var set = allowed();
      return nodes.filter(function(n) {
        if (!set.has(n.id)) return false;
        var p = n.parent ? byId[n.parent] : null;
        while (p) { if (!set.has(p.id) || collapsed.has(p.id)) return false; p = p.parent ? byId[p.parent] : null; }
        return true;
      });
    }
    function layout(list) {
      var pos = {}, leaf = 0, maxDepth = 0;
      function place(n, depth) {
        maxDepth = Math.max(maxDepth, depth);
        var kids = children(n.id, list), x;
        if (!kids.length) { x = 56 + leaf * leafGap; leaf += 1; }
        else { var xs = kids.map(function(k) { return place(k, depth + 1); }); x = xs.reduce(function(a, b) { return a + b; }, 0) / xs.length; }
        pos[n.id] = {x:x, y:20 + depth * levelGap, depth:depth}; return x;
      }
      list.filter(function(n) { return !n.parent || !list.some(function(m) { return m.id === n.parent; }); }).forEach(function(n) { place(n, 0); });
      return {pos:pos, width:Math.max(410, 112 + Math.max(1, leaf) * leafGap), height:Math.max(255, 65 + (maxDepth + 1) * levelGap)};
    }
    function edge(a, b) { var y1 = a.y + H, y2 = b.y, mid = y1 + Math.max(10, (y2 - y1) / 2); return 'M '+a.x+' '+y1+' V '+mid+' H '+b.x+' V '+y2; }
    function renderMessages() {
      var n = byId[active], path = pathTo(active).map(function(id) { return byId[id].title; }).join(' / ');
      $('threadTitle').textContent = n.full; $('threadMeta').textContent = n.meta + ' · 当前路径 ' + pathTo(active).length + ' 层';
      $('messages').innerHTML = '<div class="path"><span>学习对话</span><span>/</span><b>'+esc(path)+'</b></div><article class="message user"><div class="message-label"><span>你</span><span>提问</span></div><div class="bubble"><p>'+esc(n.q)+'</p></div></article><article class="message assistant"><div class="message-label"><span>AI</span><span>回答</span></div><div class="bubble"><p>'+esc(n.a)+'</p></div></article><article class="message assistant"><div class="message-label"><span>AI</span><span>补充</span></div><div class="bubble"><p>'+esc(n.d)+'</p></div></article><div class="branch-cta"><div><strong>继续探索这个回答</strong><br><span>从当前节点创建独立追问，不会改写其他分支。</span></div><button class="button primary" id="branchBtn">从此处继续</button></div>';
      $('branchBtn').onclick = function() { toast('已准备从“'+n.full+'”创建新分支'); };
    }
    function renderTree() {
      var list = visibleList(), l = layout(list), path = new Set(pathTo(active)), canvas = $('canvas');
      canvas.style.width = l.width+'px'; canvas.style.height = l.height+'px';
      var svg = '<svg width="'+l.width+'" height="'+l.height+'" viewBox="0 0 '+l.width+' '+l.height+'">';
      list.forEach(function(n) { if (n.parent && l.pos[n.parent]) svg += '<path class="edge '+(path.has(n.id)&&path.has(n.parent)?'active':'')+'" d="'+edge(l.pos[n.parent],l.pos[n.id])+'"></path>'; });
      svg += '</svg>';
      var html = list.map(function(n) {
        var p = l.pos[n.id], kids = children(n.id, list), cls = ['node'];
        if (n.id === active) cls.push('active'); if (path.has(n.id) && n.id !== active) cls.push('path'); if (n.id !== 'root') cls.push('branch');
        var toggle = kids.length ? '<button class="node-toggle" data-toggle="'+n.id+'" aria-label="'+(collapsed.has(n.id)?'展开子树':'折叠子树')+'">'+(collapsed.has(n.id)?'+':'−')+'</button>' : '';
        return '<div class="'+cls.join(' ')+'" data-node="'+n.id+'" role="button" tabindex="0" title="'+esc(n.full)+'" style="left:'+(p.x-W/2)+'px;top:'+p.y+'px"><span class="node-dot"></span><span class="node-copy"><strong>'+esc(n.title)+'</strong><small>'+esc(n.meta)+'</small></span>'+toggle+'</div>';
      }).join('');
      canvas.innerHTML = svg + html;
      canvas.querySelectorAll('[data-node]').forEach(function(el) { el.addEventListener('click', function() { active = el.dataset.node; pathTo(active).forEach(function(id) { collapsed.delete(id); }); renderAll(); }); el.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); } }); });
      canvas.querySelectorAll('[data-toggle]').forEach(function(el) { el.addEventListener('click', function(e) { e.stopPropagation(); var id = el.dataset.toggle; if (pathTo(active).indexOf(id) >= 0 && active !== id) active = id; if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id); renderAll(); }); });
      $('summary').textContent = list.length+' / '+sets[mode].length+' 节点';
      $('selectionTitle').textContent = byId[active].full; $('selectionPath').textContent = pathTo(active).map(function(id) { return byId[id].title; }).join(' / ');
      $('footerText').textContent = focus ? '当前路径' : '树区独立滚动'; $('focus').classList.toggle('active', focus); $('focus').textContent = focus ? '全部' : '聚焦';
      requestAnimationFrame(function() { var el = canvas.querySelector('.node.active'), viewport = $('viewport'); if (!el) return; var left = el.offsetLeft - (viewport.clientWidth-el.offsetWidth)/2, top = el.offsetTop - (viewport.clientHeight-el.offsetHeight)/2; viewport.scrollLeft = Math.max(0, Math.min(left, viewport.scrollWidth-viewport.clientWidth)); viewport.scrollTop = Math.max(0, Math.min(top, viewport.scrollHeight-viewport.clientHeight)); });
    }
    function renderAll() { renderMessages(); renderTree(); }
    $('scenario').addEventListener('change', function() { mode = $('scenario').value; collapsed.clear(); focus = false; active = mode === 'normal' ? 'proof-rank' : 'proof-rank-error'; renderAll(); });
    $('focus').addEventListener('click', function() { focus = !focus; renderAll(); });
    $('expand').addEventListener('click', function() { collapsed.clear(); focus = false; renderAll(); });
    $('locate').addEventListener('click', function() { var el = $('canvas').querySelector('.node.active'); if (el) el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'}); });
    $('newBranch').addEventListener('click', function() { toast('已准备从“'+byId[active].full+'”创建新分支'); });
    $('themeBtn').addEventListener('click', function() { var root = document.documentElement, dark = root.dataset.theme === 'dark'; root.dataset.theme = dark ? 'light' : 'dark'; $('themeBtn').textContent = dark ? '☾' : '☀'; });
    renderAll();
  </script>
</body>
</html>
