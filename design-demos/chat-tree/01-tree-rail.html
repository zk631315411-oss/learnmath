<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提问树 · 右侧窄 Rail · 学数有道</title>
  <style>
    :root {
      --lm-bg: #f6f7fb; --lm-surface: #fff; --lm-border: #e2e8f0;
      --lm-text: #334155; --lm-text-strong: #0f172a; --lm-muted: #64748b;
      --lm-brand: #4f46e5; --lm-brand-soft: #eef2ff; --lm-amber: #b45309;
      --lm-amber-soft: #fffbeb; --lm-shadow: 0 8px 28px rgb(15 23 42 / .08);
    }
    [data-theme="dark"] { --lm-bg:#0f172a; --lm-surface:#1e293b; --lm-border:#334155; --lm-text:#cbd5e1; --lm-text-strong:#f8fafc; --lm-muted:#94a3b8; --lm-brand:#818cf8; --lm-brand-soft:#272457; --lm-amber:#fbbf24; --lm-amber-soft:#332b16; --lm-shadow:0 10px 30px rgb(0 0 0 / .28); }
    * { box-sizing:border-box; }
    body { margin:0; min-width:0; background:var(--lm-bg); color:var(--lm-text); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button { font:inherit; }
    .app { min-height:100vh; display:flex; flex-direction:column; }
    .topbar { height:58px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 clamp(16px,4vw,48px); border-bottom:1px solid var(--lm-border); background:var(--lm-surface); }
    .brand { display:flex; align-items:center; gap:10px; min-width:0; color:var(--lm-text-strong); font-weight:700; }
    .brand-mark { display:grid; place-items:center; width:28px; height:28px; border-radius:8px; background:var(--lm-text-strong); color:var(--lm-surface); font-size:13px; }
    .brand small { display:block; color:var(--lm-muted); font-size:11px; font-weight:500; }
    .top-actions { display:flex; align-items:center; gap:8px; color:var(--lm-muted); font-size:12px; white-space:nowrap; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid transparent; border-radius:8px; min-height:32px; padding:0 11px; cursor:pointer; color:var(--lm-text); background:transparent; transition:.18s ease; }
    .button:hover { background:var(--lm-bg); border-color:var(--lm-border); color:var(--lm-text-strong); }
    .button.primary { color:#fff; background:var(--lm-brand); }
    .button.primary:hover { filter:brightness(.94); }
    .button.icon { width:32px; padding:0; font-size:16px; }
    .workspace { width:min(1180px,100%); margin:0 auto; padding:clamp(20px,4vw,42px) clamp(14px,4vw,32px) 56px; flex:1; }
    .intro { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:20px; }
    .eyebrow { margin:0 0 5px; color:var(--lm-brand); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0; color:var(--lm-text-strong); font-size:clamp(22px,3vw,30px); line-height:1.25; letter-spacing:0; }
    .intro p { max-width:540px; margin:8px 0 0; color:var(--lm-muted); }
    .legend { display:flex; align-items:center; gap:12px; flex-wrap:wrap; color:var(--lm-muted); font-size:12px; }
    .legend span { display:inline-flex; align-items:center; gap:6px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#cbd5e1; }
    .dot.active { background:var(--lm-brand); } .dot.branch { background:#fbbf24; }
    .chat-shell { position:relative; display:grid; grid-template-columns:minmax(0,1fr) 52px; min-height:650px; overflow:hidden; border:1px solid var(--lm-border); border-radius:12px; background:var(--lm-surface); box-shadow:var(--lm-shadow); }
    .chat-main { min-width:0; display:flex; flex-direction:column; }
    .chat-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--lm-border); }
    .chat-title { min-width:0; }
    .chat-title strong { display:block; overflow:hidden; color:var(--lm-text-strong); font-size:15px; text-overflow:ellipsis; white-space:nowrap; }
    .chat-title span { display:block; margin-top:2px; overflow:hidden; color:var(--lm-muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    .status { display:inline-flex; align-items:center; gap:6px; flex:none; color:var(--lm-muted); font-size:12px; }
    .status i { width:7px; height:7px; border-radius:50%; background:#059669; }
    .messages { flex:1; min-height:0; padding:22px clamp(16px,4vw,46px); overflow:auto; }
    .path { display:flex; align-items:center; gap:8px; margin-bottom:22px; color:var(--lm-muted); font-size:12px; }
    .path b { color:var(--lm-text); font-weight:600; }
    .path .arrow { color:var(--lm-border); }
    .message { max-width:760px; margin-bottom:18px; }
    .message.user { margin-left:auto; max-width:min(78%,620px); }
    .message-label { display:flex; align-items:center; gap:8px; margin-bottom:6px; color:var(--lm-muted); font-size:11px; }
    .message.user .message-label { justify-content:flex-end; }
    .bubble { padding:14px 16px; border:1px solid var(--lm-border); border-radius:12px; background:var(--lm-bg); color:var(--lm-text); }
    .message.user .bubble { border-color:var(--lm-brand); background:var(--lm-brand); color:#fff; border-bottom-right-radius:4px; }
    .message.assistant .bubble { border-bottom-left-radius:4px; }
    .bubble p { margin:0; } .bubble p + p { margin-top:9px; }
    .formula { display:block; margin:11px 0; padding:10px 12px; overflow:auto; border:1px solid var(--lm-border); border-radius:8px; background:var(--lm-surface); color:var(--lm-text-strong); font-family:Georgia,serif; font-size:16px; text-align:center; }
    .branch-cta { display:flex; align-items:center; justify-content:space-between; gap:14px; max-width:760px; margin:8px 0 18px; padding:12px 14px; border:1px solid #fcd34d; border-radius:8px; background:var(--lm-amber-soft); color:var(--lm-amber); font-size:12px; }
    .branch-cta strong { color:var(--lm-text-strong); font-size:13px; }
    .rail { position:relative; min-width:0; border-left:1px solid var(--lm-border); background:color-mix(in srgb,var(--lm-bg) 58%,var(--lm-surface)); }
    .rail-inner { height:100%; display:flex; flex-direction:column; align-items:center; gap:9px; padding:18px 6px; }
    .rail-title { color:var(--lm-muted); font-size:10px; writing-mode:vertical-rl; letter-spacing:.12em; }
    .rail-line { position:absolute; top:89px; bottom:58px; left:25px; width:1px; background:var(--lm-border); }
    .rail-node { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; width:38px; min-height:34px; padding:0; border:0; border-radius:8px; color:var(--lm-muted); background:transparent; cursor:pointer; }
    .rail-node:hover { background:var(--lm-surface); }
    .rail-node span { width:13px; height:13px; border:2px solid #cbd5e1; border-radius:50%; background:var(--lm-surface); }
    .rail-node.active span { border-color:var(--lm-brand); background:var(--lm-brand); box-shadow:0 0 0 4px color-mix(in srgb,var(--lm-brand) 18%,transparent); }
    .rail-node.branch span { border-color:#fbbf24; }
    .rail-node.active.branch span { border-color:#f59e0b; background:#fbbf24; }
    .rail-toggle { margin-top:auto; }
    .rail.expanded { width:184px; }
    .rail.expanded .rail-inner { align-items:stretch; padding:18px 10px; }
    .rail.expanded .rail-title { writing-mode:horizontal-tb; padding:0 7px 6px; }
    .rail.expanded .rail-line { left:26px; }
    .rail.expanded .rail-node { width:100%; justify-content:flex-start; gap:9px; padding:0 7px; }
    .rail.expanded .rail-node em { display:block; overflow:hidden; color:var(--lm-text); font-size:11px; font-style:normal; text-overflow:ellipsis; white-space:nowrap; }
    .rail:not(.expanded) .rail-node em { display:none; }
    .toast { position:fixed; right:24px; bottom:24px; z-index:10; max-width:min(360px,calc(100vw - 32px)); padding:11px 14px; border:1px solid var(--lm-border); border-radius:8px; background:var(--lm-surface); box-shadow:var(--lm-shadow); color:var(--lm-text); font-size:12px; opacity:0; transform:translateY(8px); pointer-events:none; transition:.2s ease; }
    .toast.show { opacity:1; transform:none; }
    .variant-note { margin-top:18px; color:var(--lm-muted); font-size:12px; }
    @media (max-width:720px) {
      .topbar { height:54px; padding:0 14px; } .brand small,.top-actions span { display:none; }
      .workspace { padding:20px 10px 30px; } .intro { display:block; } .intro .legend { margin-top:14px; }
      .chat-shell { display:flex; flex-direction:column; min-height:calc(100vh - 190px); border-radius:10px; }
      .chat-head { padding:14px; } .messages { padding:18px 13px 20px; } .message.user { max-width:90%; }
      .rail { order:2; width:auto!important; height:58px; border-top:1px solid var(--lm-border); border-left:0; }
      .rail-inner,.rail.expanded .rail-inner { height:58px; flex-direction:row; align-items:center; gap:5px; overflow:auto; padding:9px 10px; }
      .rail-title,.rail.expanded .rail-title { display:none; } .rail-line,.rail.expanded .rail-line { top:28px; right:38px; bottom:auto; left:34px; width:auto; height:1px; }
      .rail-node,.rail.expanded .rail-node { width:42px; min-width:42px; height:36px; justify-content:center; padding:0; } .rail-node em { display:none!important; }
      .rail-toggle { margin:0 0 0 auto; } .branch-cta { align-items:flex-start; flex-direction:column; gap:8px; }
      .toast { right:16px; bottom:16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">学</span><div>学数有道<small>提问树 · 方案 1</small></div></div>
      <div class="top-actions"><span>高等代数（上册）</span><button class="button icon" id="themeBtn" aria-label="切换暗色模式" title="切换暗色模式">☾</button></div>
    </header>
    <main class="workspace">
      <div class="intro"><div><p class="eyebrow">Conversation tree / rail</p><h1>右侧窄 Rail</h1><p>树默认退到边缘，需要时展开查看标题；回答区域保持连续、安静。</p></div><div class="legend"><span><i class="dot active"></i>当前路径</span><span><i class="dot branch"></i>可探索分支</span></div></div>
      <section class="chat-shell">
        <div class="chat-main"><div class="chat-head"><div class="chat-title"><strong id="threadTitle"></strong><span id="threadMeta"></span></div><div class="status"><i></i>已保存</div></div><div class="messages" id="messages"></div></div>
        <aside class="rail" id="rail"><span class="rail-line"></span><div class="rail-inner"><span class="rail-title">提问路径</span><div id="railNodes"></div><button class="button icon rail-toggle" id="railToggle" aria-label="展开或收起提问树" title="展开或收起提问树">‹</button></div></aside>
      </section>
      <p class="variant-note">操作提示：点击右侧节点切换分支；点击回答下方的“从此处继续”模拟创建入口。</p>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const tree = {
      root:{title:'什么是线性无关？',meta:'根问题 · 3 条分支',kind:'root',messages:[['user','什么是线性无关？'],['assistant','线性无关描述的是一组向量之间没有“多余成员”：任何一个向量都不能由其余向量线性表示。'],['assistant','如果只有平凡组合能得到零向量，就称这组向量线性无关。','formula','c₁v₁ + c₂v₂ + … + cₙvₙ = 0  ⇒  c₁ = c₂ = … = cₙ = 0'],['assistant','先把它理解成“每个方向都带来新的信息”，后面的判定方法都围绕这个核心。']]},
      proof:{title:'从定义证明判定方法',meta:'分支一 · 2 条消息',kind:'branch',messages:[['user','能从定义证明判定方法吗？'],['assistant','可以。把向量按列组成矩阵 A，齐次方程 Ax = 0 的解恰好对应线性组合的系数。'],['assistant','当且仅当 Ax = 0 只有零解时，列向量线性无关；这也等价于矩阵的列秩等于列数。']]},
      counter:{title:'反例与易错点',meta:'分支二 · 2 条消息',kind:'branch',messages:[['user','给一个反例，顺便说说容易错在哪里？'],['assistant','向量 (1, 2) 与 (2, 4) 不是线性无关，因为第二个向量等于第一个向量的 2 倍。'],['assistant','常见误区是只看向量个数，或者把“向量不相同”误当作线性无关；关键始终是是否存在非平凡线性组合。']]},
      geometry:{title:'换一种几何解释',meta:'分支三 · 2 条消息',kind:'branch',messages:[['user','可以用几何方式解释吗？'],['assistant','在二维平面里，两个不共线的向量提供两个独立方向，因此它们线性无关。'],['assistant','若两个向量落在同一条直线上，一个方向可以被另一个缩放得到，它们就线性相关。']]}
    };
    let active='root';
    const $=id=>document.getElementById(id);
    function showToast(text){ const el=$('toast'); el.textContent=text; el.classList.add('show'); clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>el.classList.remove('show'),2200); }
    function render(){ const item=tree[active]; $('threadTitle').textContent=item.title; $('threadMeta').textContent=item.meta; const path=active==='root'?'根问题':`根问题  /  ${item.title}`; const content=item.messages.map(([role,text,kind,formula])=>`<article class="message ${role}"><div class="message-label"><span>${role==='user'?'你':'AI'}</span><span>${role==='user'?'提问':'回答'}</span></div><div class="bubble"><p>${text}</p>${kind==='formula'?`<code class="formula">${formula}</code>`:''}</div></article>`).join(''); $('messages').innerHTML=`<div class="path"><span>学习对话</span><span class="arrow">/</span><b>${path}</b></div>${content}<div class="branch-cta"><div><strong>继续探索这个回答</strong><br><span>从当前节点创建一条独立追问，不带入兄弟分支。</span></div><button class="button primary" id="branchBtn">从此处继续</button></div>`; $('branchBtn').onclick=()=>showToast(`已准备从“${item.title}”创建新分支`); renderRail(); }
    function renderRail(){ $('railNodes').innerHTML=Object.entries(tree).map(([id,item])=>`<button class="rail-node ${id===active?'active':''} ${item.kind==='branch'?'branch':''}" data-node="${id}" title="${item.title}" aria-label="切换到${item.title}"><span></span><em>${item.title}</em></button>`).join(''); document.querySelectorAll('[data-node]').forEach(btn=>btn.onclick=()=>{active=btn.dataset.node;render();}); }
    $('railToggle').onclick=()=>{ $('rail').classList.toggle('expanded'); $('railToggle').textContent=$('rail').classList.contains('expanded')?'›':'‹'; };
    $('themeBtn').onclick=()=>{ const root=document.documentElement; const dark=root.dataset.theme==='dark'; root.dataset.theme=dark?'light':'dark'; $('themeBtn').textContent=dark?'☾':'☀'; };
    render();
  </script>
</body>
</html>
