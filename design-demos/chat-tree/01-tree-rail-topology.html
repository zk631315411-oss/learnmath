<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提问树 · 真正的树状 Rail · 学数有道</title>
  <style>
    :root {
      --lm-bg: #f6f7fb;
      --lm-surface: #ffffff;
      --lm-surface-2: #f8fafc;
      --lm-border: #e2e8f0;
      --lm-text: #334155;
      --lm-strong: #0f172a;
      --lm-muted: #64748b;
      --lm-brand: #4f46e5;
      --lm-brand-soft: #eef2ff;
      --lm-amber: #b45309;
      --lm-amber-soft: #fffbeb;
      --lm-line: #cbd5e1;
      --lm-shadow: 0 10px 30px rgb(15 23 42 / .08);
      --tree-width: 390px;
    }
    [data-theme="dark"] {
      --lm-bg: #0f172a;
      --lm-surface: #1e293b;
      --lm-surface-2: #172235;
      --lm-border: #334155;
      --lm-text: #cbd5e1;
      --lm-strong: #f8fafc;
      --lm-muted: #94a3b8;
      --lm-brand: #818cf8;
      --lm-brand-soft: #272457;
      --lm-amber: #fbbf24;
      --lm-amber-soft: #332b16;
      --lm-line: #475569;
      --lm-shadow: 0 12px 34px rgb(0 0 0 / .3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 0;
      background: var(--lm-bg);
      color: var(--lm-text);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, select { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 clamp(16px, 4vw, 48px);
      border-bottom: 1px solid var(--lm-border);
      background: var(--lm-surface);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--lm-strong); font-weight: 700; }
    .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--lm-strong); color: var(--lm-surface); font-size: 13px; }
    .brand small { display: block; color: var(--lm-muted); font-size: 11px; font-weight: 500; }
    .top-actions { display: flex; align-items: center; gap: 8px; color: var(--lm-muted); font-size: 12px; white-space: nowrap; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--lm-text);
      transition: .18s ease;
    }
    .button:hover { border-color: var(--lm-border); background: var(--lm-bg); color: var(--lm-strong); }
    .button.icon { width: 32px; padding: 0; font-size: 16px; }
    .button.primary { border-color: var(--lm-brand); background: var(--lm-brand); color: #fff; }
    .button.primary:hover { filter: brightness(.94); }
    .workspace { width: min(1240px, 100%); margin: 0 auto; padding: clamp(20px, 4vw, 42px) clamp(14px, 4vw, 32px) 56px; flex: 1; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .eyebrow { margin: 0 0 5px; color: var(--lm-brand); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--lm-strong); font-size: clamp(22px, 3vw, 30px); line-height: 1.25; letter-spacing: 0; }
    .intro p { max-width: 600px; margin: 8px 0 0; color: var(--lm-muted); }
    .legend { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--lm-muted); font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--lm-line); }
    .legend i.active { background: var(--lm-brand); }
    .legend i.ancestor { background: #94a3b8; }
    .legend i.branch { background: #fbbf24; }
    .demo-shell {
      --tree-width: 390px;
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--tree-width);
      min-height: 700px;
      overflow: hidden;
      border: 1px solid var(--lm-border);
      border-radius: 12px;
      background: var(--lm-surface);
      box-shadow: var(--lm-shadow);
      transition: grid-template-columns .22s ease;
    }
    .demo-shell.tree-collapsed { --tree-width: 56px; }
    .chat-main { min-width: 0; display: flex; flex-direction: column; }
    .chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--lm-border);
    }
    .chat-title { min-width: 0; }
    .chat-title strong { display: block; overflow: hidden; color: var(--lm-strong); font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .chat-title span { display: block; margin-top: 2px; overflow: hidden; color: var(--lm-muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .status { display: inline-flex; align-items: center; gap: 6px; flex: none; color: var(--lm-muted); font-size: 12px; }
    .status i { width: 7px; height: 7px; border-radius: 50%; background: #059669; }
    .messages { flex: 1; min-height: 0; padding: 22px clamp(16px, 4vw, 48px); overflow: auto; }
    .path { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; color: var(--lm-muted); font-size: 12px; }
    .path b { color: var(--lm-text); font-weight: 600; }
    .path .slash { color: var(--lm-border); }
    .message { max-width: 760px; margin-bottom: 18px; }
    .message.user { max-width: min(78%, 620px); margin-left: auto; }
    .message-label { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--lm-muted); font-size: 11px; }
    .message.user .message-label { justify-content: flex-end; }
    .bubble { padding: 14px 16px; border: 1px solid var(--lm-border); border-radius: 12px; background: var(--lm-bg); color: var(--lm-text); }
    .message.user .bubble { border-color: var(--lm-brand); border-bottom-right-radius: 4px; background: var(--lm-brand); color: #fff; }
    .message.assistant .bubble { border-bottom-left-radius: 4px; }
    .bubble p { margin: 0; }
    .bubble p + p { margin-top: 9px; }
    .formula { display: block; margin: 11px 0; padding: 10px 12px; overflow: auto; border: 1px solid var(--lm-border); border-radius: 8px; background: var(--lm-surface); color: var(--lm-strong); font: 16px Georgia, serif; text-align: center; }
    .branch-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      max-width: 760px;
      margin: 8px 0 18px;
      padding: 12px 14px;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      background: var(--lm-amber-soft);
      color: var(--lm-amber);
      font-size: 12px;
    }
    .branch-cta strong { color: var(--lm-strong); font-size: 13px; }
    .tree-rail { min-width: 0; display: flex; flex-direction: column; border-left: 1px solid var(--lm-border); background: var(--lm-surface-2); }
    .tree-collapsed-view { display: none; height: 100%; flex-direction: column; align-items: center; gap: 12px; padding: 16px 6px; }
    .tree-collapsed .tree-expanded-view { display: none; }
    .tree-collapsed .tree-collapsed-view { display: flex; }
    .collapsed-label { color: var(--lm-muted); font-size: 10px; letter-spacing: .12em; writing-mode: vertical-rl; }
    .collapsed-dots { position: relative; display: flex; flex: 1; flex-direction: column; align-items: center; gap: 14px; padding-top: 14px; }
    .collapsed-dots::before { position: absolute; top: 21px; bottom: 10px; left: 50%; width: 1px; background: var(--lm-line); content: ""; }
    .collapsed-dot { position: relative; z-index: 1; width: 12px; height: 12px; border: 2px solid var(--lm-line); border-radius: 50%; background: var(--lm-surface-2); }
    .collapsed-dot.active { border-color: var(--lm-brand); background: var(--lm-brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--lm-brand) 18%, transparent); }
    .tree-expanded-view { min-width: 0; display: flex; flex: 1; flex-direction: column; }
    .tree-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 13px 14px 10px; border-bottom: 1px solid var(--lm-border); }
    .tree-heading { min-width: 0; }
    .tree-heading strong { display: block; color: var(--lm-strong); font-size: 13px; }
    .tree-heading span { display: block; margin-top: 1px; color: var(--lm-muted); font-size: 11px; }
    .tree-header-actions { display: flex; gap: 3px; }
    .tree-toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 9px 12px; border-bottom: 1px solid var(--lm-border); }
    .tree-toolbar select { min-width: 116px; height: 30px; padding: 0 7px; border: 1px solid var(--lm-border); border-radius: 7px; outline: none; background: var(--lm-surface); color: var(--lm-text); font-size: 11px; }
    .tree-toolbar select:focus { border-color: var(--lm-brand); }
    .tree-toolbar .button { min-height: 30px; padding: 0 7px; font-size: 11px; }
    .tree-toolbar .button.active { border-color: var(--lm-brand); background: var(--lm-brand-soft); color: var(--lm-brand); }
    .arrangement-note { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--lm-border); color: var(--lm-muted); font-size: 10px; line-height: 1.45; }
    .arrangement-note b { color: var(--lm-text); font-weight: 600; }
    .tree-viewport { position: relative; flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
    .tree-canvas { position: relative; min-width: 520px; min-height: 500px; }
    .tree-canvas svg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
    .tree-edge { fill: none; stroke: var(--lm-line); stroke-width: 1.5; }
    .tree-edge.active { stroke: var(--lm-brand); stroke-width: 2.4; }
    .tree-node {
      position: absolute;
      display: flex;
      align-items: flex-start;
      width: 126px;
      min-height: 54px;
      padding: 8px 8px 7px 10px;
      border: 1px solid var(--lm-border);
      border-radius: 8px;
      outline: none;
      background: var(--lm-surface);
      color: var(--lm-text);
      cursor: pointer;
      box-shadow: 0 2px 8px rgb(15 23 42 / .04);
      transition: border-color .16s ease, background .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .tree-node:hover { border-color: var(--lm-brand); box-shadow: 0 5px 13px rgb(15 23 42 / .1); transform: translateY(-1px); }
    .tree-node:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--lm-brand) 26%, transparent); }
    .tree-node.active { border-color: var(--lm-brand); background: var(--lm-brand-soft); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lm-brand) 16%, transparent); }
    .tree-node.ancestor { border-color: #94a3b8; }
    .tree-node.branch { border-top: 2px solid #fbbf24; }
    .tree-node.active.branch { border-color: #f59e0b; background: var(--lm-amber-soft); }
    .node-copy { min-width: 0; padding-right: 2px; }
    .node-copy strong { display: block; overflow: hidden; color: var(--lm-strong); font-size: 11px; font-weight: 650; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .node-copy small { display: block; margin-top: 2px; overflow: hidden; color: var(--lm-muted); font-size: 9px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
    .node-dot { flex: none; width: 9px; height: 9px; margin: 3px 7px 0 0; border: 2px solid var(--lm-line); border-radius: 50%; background: var(--lm-surface); }
    .tree-node.active .node-dot { border-color: var(--lm-brand); background: var(--lm-brand); }
    .tree-node.ancestor .node-dot { border-color: #94a3b8; background: #94a3b8; }
    .tree-node.branch .node-dot { border-color: #fbbf24; }
    .tree-node.active.branch .node-dot { border-color: #f59e0b; background: #fbbf24; }
    .node-toggle { position: absolute; right: 5px; bottom: 4px; display: grid; place-items: center; width: 15px; height: 15px; padding: 0; border: 1px solid var(--lm-border); border-radius: 4px; background: var(--lm-surface); color: var(--lm-muted); font-size: 11px; line-height: 1; }
    .node-toggle:hover { border-color: var(--lm-brand); color: var(--lm-brand); }
    .tree-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--lm-border); color: var(--lm-muted); font-size: 10px; }
    .tree-footer button { border: 0; background: transparent; color: var(--lm-brand); font-size: 10px; }
    .tree-footer button:hover { text-decoration: underline; }
    .variant-note { margin-top: 18px; color: var(--lm-muted); font-size: 12px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 10; max-width: min(360px, calc(100vw - 32px)); padding: 11px 14px; border: 1px solid var(--lm-border); border-radius: 8px; background: var(--lm-surface); box-shadow: var(--lm-shadow); color: var(--lm-text); font-size: 12px; opacity: 0; pointer-events: none; transform: translateY(8px); transition: .2s ease; }
    .toast.show { opacity: 1; transform: none; }
    @media (max-width: 820px) {
      .demo-shell { display: flex; flex-direction: column; min-height: calc(100vh - 190px); }
      .tree-rail { order: 2; width: 100%; height: 320px; border-top: 1px solid var(--lm-border); border-left: 0; }
      .demo-shell.tree-collapsed .tree-rail { height: 62px; }
      .tree-collapsed-view { height: 62px; flex-direction: row; align-items: center; padding: 8px 12px; }
      .collapsed-label { writing-mode: horizontal-tb; }
      .collapsed-dots { flex-direction: row; align-items: center; gap: 9px; padding: 0 8px; overflow: hidden; }
      .collapsed-dots::before { top: 50%; right: 10px; bottom: auto; left: 8px; width: auto; height: 1px; }
      .tree-expanded-view { height: 320px; flex: none; }
      .tree-collapsed .tree-expanded-view { display: none; }
      .tree-collapsed .tree-collapsed-view { display: flex; }
      .tree-canvas { min-height: 235px; }
      .intro { display: block; }
      .intro .legend { margin-top: 14px; }
      .topbar { height: 54px; padding: 0 14px; }
      .brand small, .top-actions > span { display: none; }
      .workspace { padding: 20px 10px 30px; }
      .messages { padding: 18px 13px 20px; }
      .message.user { max-width: 90%; }
      .branch-cta { align-items: flex-start; flex-direction: column; gap: 8px; }
      .toast { right: 16px; bottom: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">学</span><div>学数有道<small>提问树 · 方案 1B</small></div></div>
      <div class="top-actions"><span>高等代数（上册）</span><button class="button icon" id="themeBtn" aria-label="切换暗色模式" title="切换暗色模式">☾</button></div>
    </header>
    <main class="workspace">
      <div class="intro">
        <div>
          <p class="eyebrow">Conversation tree / topology rail</p>
          <h1>真正的树状 Rail</h1>
          <p>父节点在上，同层分支横向展开；分支变多后用横向滚动、折叠旁支和当前路径聚焦保持可读性。</p>
        </div>
        <div class="legend"><span><i class="active"></i>当前节点</span><span><i class="ancestor"></i>祖先路径</span><span><i class="branch"></i>可继续分支</span></div>
      </div>
      <section class="demo-shell" id="demoShell">
        <div class="chat-main">
          <div class="chat-head">
            <div class="chat-title"><strong id="threadTitle"></strong><span id="threadMeta"></span></div>
            <div class="status"><i></i>已保存</div>
          </div>
          <div class="messages" id="messages"></div>
        </div>
        <aside class="tree-rail">
          <div class="tree-collapsed-view">
            <span class="collapsed-label">对话树</span>
            <div class="collapsed-dots" id="collapsedDots"></div>
            <button class="button icon" id="expandCollapsed" aria-label="展开对话树" title="展开对话树">‹</button>
          </div>
          <div class="tree-expanded-view">
            <div class="tree-header">
              <div class="tree-heading"><strong>对话树</strong><span id="treeSummary"></span></div>
              <div class="tree-header-actions"><button class="button icon" id="collapseRail" aria-label="收起对话树" title="收起对话树">›</button></div>
            </div>
            <div class="tree-toolbar">
              <select id="scenario" aria-label="选择分支规模">
                <option value="compact">3 个分支</option>
                <option value="medium">8 个节点</option>
                <option value="dense" selected>15 个节点</option>
              </select>
              <button class="button" id="focusBtn">聚焦当前路径</button>
              <button class="button" id="expandAllBtn">全部展开</button>
            </div>
            <div class="arrangement-note"><b>安排方式</b><span>同层横排 · 超出横向滚动 · 非当前旁支可折叠</span></div>
            <div class="tree-viewport" id="treeViewport"><div class="tree-canvas" id="treeCanvas"></div></div>
            <div class="tree-footer"><span id="treeFooterText"></span><button id="locateBtn">定位当前节点</button></div>
          </div>
        </aside>
      </section>
      <p class="variant-note">试试右侧的“15 个节点”：同一层不会压成一列，滚动树面板即可查看远端分支；点击节点切换对话，点击节点右下角的小方块折叠其子树。</p>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    var nodes = [
      {id:'root', parent:null, title:'什么是线性无关？', meta:'根问题', question:'什么是线性无关？', answer:'线性无关描述的是一组向量之间没有“多余成员”：任何一个向量都不能由其余向量线性表示。', detail:'先把它理解成“每个方向都带来新的信息”，后面的判定方法都围绕这个核心。'},
      {id:'definition', parent:'root', title:'回到定义', meta:'分支 1', question:'能先从定义讲清楚吗？', answer:'如果只有平凡组合能得到零向量，就称这组向量线性无关。', detail:'这条路径适合先建立概念，再进入判定。'},
      {id:'proof', parent:'root', title:'从定义证明', meta:'分支 2', question:'能从定义证明判定方法吗？', answer:'把向量按列组成矩阵 A，齐次方程 Ax = 0 的解恰好对应线性组合的系数。', detail:'当且仅当 Ax = 0 只有零解时，列向量线性无关。'},
      {id:'example', parent:'root', title:'看一个例子', meta:'分支 3', question:'给一个直观例子吧。', answer:'向量 (1, 0) 与 (0, 1) 提供两个独立方向，因此它们线性无关。', detail:'例子能帮助检查定义是否真的被理解。'},
      {id:'def-intuition', parent:'definition', title:'直观比喻', meta:'定义 · 子分支', question:'可以用“信息量”来比喻吗？', answer:'可以。每加入一个线性无关向量，就增加一个不能由已有向量替代的新方向。', detail:'这是一种直觉解释，不能替代正式定义。'},
      {id:'def-formal', parent:'definition', title:'写成公式', meta:'定义 · 子分支', question:'把定义写成公式是什么？', answer:'c₁v₁ + c₂v₂ + … + cₙvₙ = 0  ⇒  c₁ = c₂ = … = cₙ = 0。', detail:'所有系数都为零，称为只有平凡解。'},
      {id:'proof-rank', parent:'proof', title:'列秩判定', meta:'证明 · 子分支', question:'和列秩有什么关系？', answer:'列向量线性无关，当且仅当矩阵的列秩等于列数。', detail:'这是实际计算中最常用的等价判定之一。'},
      {id:'proof-gauss', parent:'proof', title:'高斯消元', meta:'证明 · 子分支', question:'能用高斯消元检验吗？', answer:'可以。把矩阵化为阶梯形，若每一列都有主元，就说明列向量线性无关。', detail:'消元过程把抽象定义变成了可执行的检查步骤。'},
      {id:'example-counter', parent:'example', title:'反例与易错点', meta:'例子 · 子分支', question:'给一个相关的反例。', answer:'向量 (1, 2) 与 (2, 4) 不是线性无关，因为第二个向量等于第一个向量的 2 倍。', detail:'向量不相同，并不意味着它们线性无关。'},
      {id:'example-geometry', parent:'example', title:'几何解释', meta:'例子 · 子分支', question:'可以用几何方式解释吗？', answer:'在二维平面里，不共线的两个向量提供两个独立方向，因此线性无关。', detail:'若两个向量落在同一条直线上，一个方向可以由另一个缩放得到。'},
      {id:'def-intuition-analogy', parent:'def-intuition', title:'书架类比', meta:'直观 · 深入', question:'再给一个生活类比。', answer:'像书架上的独立支点：删掉任何一个，能覆盖的方向就少一个。', detail:'类比只帮助记忆，回到计算时仍要检查齐次方程。'},
      {id:'proof-rank-practice', parent:'proof-rank', title:'练一道判定题', meta:'列秩 · 深入', question:'能给一道小练习吗？', answer:'判断 (1, 0, 1)、(0, 1, 1)、(1, 1, 2) 是否线性无关。', detail:'第三个向量等于前两个之和，因此这组三向量线性相关。'},
      {id:'proof-rank-error', parent:'proof-rank', title:'主元误判', meta:'列秩 · 易错', question:'没有主元时容易错在哪里？', answer:'自由变量意味着存在非平凡解，不能把“行数足够”误认为“列向量独立”。', detail:'要数的是每一列是否获得主元，而不是只看矩阵的外形。'},
      {id:'example-geometry-visual', parent:'example-geometry', title:'画成方向', meta:'几何 · 深入', question:'怎么把它画出来？', answer:'从原点画箭头：不共线的箭头张成一个平面区域，只有一个方向时只能落在一条直线上。', detail:'图像能提示维度，但最终结论仍由线性组合决定。'},
      {id:'example-geometry-3d', parent:'example-geometry', title:'推广到三维', meta:'几何 · 延伸', question:'三维里怎么推广？', answer:'三个向量若不落在同一个平面内，就提供三个独立方向，构成线性无关组。', detail:'这与三阶矩阵的非零行列式判定相互对应。'}
    ];
    var nodeById = {};
    nodes.forEach(function(node) { nodeById[node.id] = node; });
    var scenarioSets = {
      compact: ['root','definition','proof','example'],
      medium: ['root','definition','proof','example','def-intuition','def-formal','proof-rank','example-counter'],
      dense: nodes.map(function(node) { return node.id; })
    };
    var scenario = 'dense';
    var activeId = 'proof-rank-error';
    var collapsed = new Set();
    var focusMode = false;
    var NODE_W = 126;
    var NODE_H = 54;
    var LEVEL_GAP = 92;
    var LEAF_GAP = 158;
    var $ = function(id) { return document.getElementById(id); };
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function(char) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];
      });
    }
    function showToast(text) {
      var el = $('toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(function() { el.classList.remove('show'); }, 2200);
    }
    function baseAllowed() {
      var set = new Set(scenarioSets[scenario]);
      if (focusMode) {
        var path = new Set(pathTo(activeId));
        path.add(activeId);
        nodes.forEach(function(node) {
          if (node.parent === activeId) path.add(node.id);
        });
        set = new Set(Array.from(set).filter(function(id) { return path.has(id); }));
      }
      return set;
    }
    function pathTo(id) {
      var path = [];
      var cursor = nodeById[id];
      while (cursor) {
        path.unshift(cursor.id);
        cursor = cursor.parent ? nodeById[cursor.parent] : null;
      }
      return path;
    }
    function hasVisibleParent(id, allowed) {
      var cursor = nodeById[id];
      while (cursor && cursor.parent) {
        if (!allowed.has(cursor.parent)) return false;
        if (collapsed.has(cursor.parent)) return false;
        cursor = nodeById[cursor.parent];
      }
      return true;
    }
    function currentVisibleNodes() {
      var allowed = baseAllowed();
      return nodes.filter(function(node) {
        return allowed.has(node.id) && hasVisibleParent(node.id, allowed);
      });
    }
    function childrenOf(id, list) {
      return list.filter(function(node) { return node.parent === id; });
    }
    function renderMessages() {
      var node = nodeById[activeId];
      var path = pathTo(activeId);
      var pathText = path.map(function(id) { return nodeById[id].title; }).join(' / ');
      var html = '<div class="path"><span>学习对话</span><span class="slash">/</span><b>' + escapeHtml(pathText) + '</b></div>';
      html += '<article class="message user"><div class="message-label"><span>你</span><span>提问</span></div><div class="bubble"><p>' + escapeHtml(node.question) + '</p></div></article>';
      html += '<article class="message assistant"><div class="message-label"><span>AI</span><span>回答</span></div><div class="bubble"><p>' + escapeHtml(node.answer) + '</p></div></article>';
      html += '<article class="message assistant"><div class="message-label"><span>AI</span><span>补充</span></div><div class="bubble"><p>' + escapeHtml(node.detail) + '</p></div></article>';
      html += '<div class="branch-cta"><div><strong>继续探索这个回答</strong><br><span>从当前节点创建独立追问，不会改写其他分支。</span></div><button class="button primary" id="branchBtn">从此处继续</button></div>';
      $('messages').innerHTML = html;
      $('threadTitle').textContent = node.title;
      $('threadMeta').textContent = node.meta + ' · 当前路径 ' + path.length + ' 层';
      $('branchBtn').onclick = function() { showToast('已准备从“' + node.title + '”创建新分支'); };
    }
    function layoutTree(list) {
      var positions = {};
      var nextLeaf = 0;
      var maxDepth = 0;
      function place(node, depth) {
        maxDepth = Math.max(maxDepth, depth);
        var children = childrenOf(node.id, list);
        var x;
        if (!children.length) {
          x = 72 + nextLeaf * LEAF_GAP;
          nextLeaf += 1;
        } else {
          var childX = children.map(function(child) { return place(child, depth + 1); });
          x = childX.reduce(function(total, value) { return total + value; }, 0) / childX.length;
        }
        positions[node.id] = {x:x, y:24 + depth * LEVEL_GAP, depth:depth};
        return x;
      }
      var roots = list.filter(function(node) { return !node.parent || !list.some(function(candidate) { return candidate.id === node.parent; }); });
      roots.forEach(function(root) { place(root, 0); });
      return {positions:positions, width:Math.max(520, 144 + Math.max(1, nextLeaf) * LEAF_GAP), height:Math.max(270, 90 + (maxDepth + 1) * LEVEL_GAP)};
    }
    function edgePath(parent, child) {
      var startY = parent.y + NODE_H;
      var endY = child.y;
      var midY = startY + Math.max(12, (endY - startY) / 2);
      return 'M ' + parent.x + ' ' + startY + ' V ' + midY + ' H ' + child.x + ' V ' + endY;
    }
    function renderCollapsedDots() {
      var path = new Set(pathTo(activeId));
      var ids = scenarioSets[scenario].filter(function(id) { return id === 'root' || path.has(id); }).slice(0, 8);
      $('collapsedDots').innerHTML = ids.map(function(id) {
        return '<span class="collapsed-dot ' + (id === activeId ? 'active' : '') + '" title="' + escapeHtml(nodeById[id].title) + '"></span>';
      }).join('');
    }
    function renderTree() {
      var list = currentVisibleNodes();
      var layout = layoutTree(list);
      var path = new Set(pathTo(activeId));
      var canvas = $('treeCanvas');
      canvas.style.width = layout.width + 'px';
      canvas.style.height = layout.height + 'px';
      var svg = '<svg width="' + layout.width + '" height="' + layout.height + '" viewBox="0 0 ' + layout.width + ' ' + layout.height + '" aria-hidden="true">';
      list.forEach(function(node) {
        if (!node.parent || !layout.positions[node.parent]) return;
        var edgeClass = path.has(node.id) && path.has(node.parent) ? 'tree-edge active' : 'tree-edge';
        svg += '<path class="' + edgeClass + '" d="' + edgePath(layout.positions[node.parent], layout.positions[node.id]) + '"></path>';
      });
      svg += '</svg>';
      var nodesHtml = list.map(function(node) {
        var pos = layout.positions[node.id];
        var children = childrenOf(node.id, list);
        var classes = ['tree-node'];
        if (node.id === activeId) classes.push('active');
        if (path.has(node.id) && node.id !== activeId) classes.push('ancestor');
        if (node.id !== 'root') classes.push('branch');
        var toggle = children.length ? '<button class="node-toggle" data-toggle="' + node.id + '" aria-label="' + (collapsed.has(node.id) ? '展开子树' : '折叠子树') + '">' + (collapsed.has(node.id) ? '+' : '−') + '</button>' : '';
        return '<div class="' + classes.join(' ') + '" data-node="' + node.id + '" role="button" tabindex="0" aria-label="切换到' + escapeHtml(node.title) + '" style="left:' + (pos.x - NODE_W / 2) + 'px;top:' + pos.y + 'px"><span class="node-dot"></span><span class="node-copy"><strong>' + escapeHtml(node.title) + '</strong><small>' + escapeHtml(node.meta) + '</small></span>' + toggle + '</div>';
      }).join('');
      canvas.innerHTML = svg + nodesHtml;
      canvas.querySelectorAll('[data-node]').forEach(function(el) {
        el.addEventListener('click', function() {
          activeId = el.getAttribute('data-node');
          var activeNode = nodeById[activeId];
          var allowed = new Set(scenarioSets[scenario]);
          pathTo(activeId).forEach(function(id) { collapsed.delete(id); });
          if (!allowed.has(activeId)) activeId = 'root';
          renderAll();
        });
        el.addEventListener('keydown', function(event) {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); el.click(); }
        });
      });
      canvas.querySelectorAll('[data-toggle]').forEach(function(el) {
        el.addEventListener('click', function(event) {
          event.stopPropagation();
          var id = el.getAttribute('data-toggle');
          if (pathTo(activeId).indexOf(id) >= 0 && activeId !== id) activeId = id;
          if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
          renderAll();
        });
      });
      $('treeSummary').textContent = list.length + ' / ' + scenarioSets[scenario].length + ' 个节点可见';
      $('treeFooterText').textContent = focusMode ? '当前路径聚焦中' : '同层横排，分支可折叠';
      renderCollapsedDots();
      requestAnimationFrame(function() {
        var active = canvas.querySelector('.tree-node.active');
        var viewport = $('treeViewport');
        if (!active || !viewport) return;
        var desiredLeft = active.offsetLeft - (viewport.clientWidth - active.offsetWidth) / 2;
        var desiredTop = active.offsetTop - (viewport.clientHeight - active.offsetHeight) / 2;
        viewport.scrollLeft = Math.max(0, Math.min(desiredLeft, viewport.scrollWidth - viewport.clientWidth));
        viewport.scrollTop = Math.max(0, Math.min(desiredTop, viewport.scrollHeight - viewport.clientHeight));
      });
    }
    function renderAll() {
      renderMessages();
      renderTree();
      $('focusBtn').classList.toggle('active', focusMode);
      $('focusBtn').textContent = focusMode ? '显示全部分支' : '聚焦当前路径';
    }
    function chooseScenario(value) {
      scenario = value;
      collapsed.clear();
      focusMode = false;
      activeId = value === 'compact' ? 'proof' : value === 'medium' ? 'proof-rank' : 'proof-rank-error';
      renderAll();
    }
    $('scenario').addEventListener('change', function() { chooseScenario($('scenario').value); });
    $('focusBtn').addEventListener('click', function() { focusMode = !focusMode; renderAll(); });
    $('expandAllBtn').addEventListener('click', function() { collapsed.clear(); focusMode = false; renderAll(); });
    $('collapseRail').addEventListener('click', function() { $('demoShell').classList.add('tree-collapsed'); });
    $('expandCollapsed').addEventListener('click', function() { $('demoShell').classList.remove('tree-collapsed'); });
    $('locateBtn').addEventListener('click', function() {
      var active = $('treeCanvas').querySelector('.tree-node.active');
      if (active) active.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
    });
    $('themeBtn').addEventListener('click', function() {
      var root = document.documentElement;
      var dark = root.getAttribute('data-theme') === 'dark';
      root.setAttribute('data-theme', dark ? 'light' : 'dark');
      $('themeBtn').textContent = dark ? '☾' : '☀';
    });
    renderAll();
  </script>
</body>
</html>
